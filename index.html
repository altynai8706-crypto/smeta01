<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Смета за 5 минут</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>Смета за 5 минут</h1>
        <p>Добавьте позиции — суммы и итог посчитаются автоматически.</p>
      </header>
      <header class="print-header" aria-hidden="true">
        <h1>Смета № <span id="print-number">—</span> от <span id="print-date">—</span></h1>
      </header>

      <section class="card" aria-labelledby="details-heading">
        <h2 id="details-heading">Реквизиты</h2>
        <div class="details-grid">
          <label class="field">
            <span>От кого</span>
            <input type="text" name="from" autocomplete="organization" placeholder="Ваша компания или имя">
            <span id="print-from" class="print-value"></span>
          </label>
          <label class="field">
            <span>Для кого</span>
            <input type="text" name="to" placeholder="Клиент или организация">
            <span id="print-to" class="print-value"></span>
          </label>
          <label class="field">
            <span>Номер сметы</span>
            <input type="text" name="estimate-number" placeholder="Например, 001">
            <span id="print-detail-number" class="print-value"></span>
          </label>
          <label class="field">
            <span>Дата</span>
            <input id="estimate-date" type="date" name="date">
            <span id="print-detail-date" class="print-value"></span>
          </label>
        </div>
      </section>

      <section class="card positions-card" aria-labelledby="positions-heading">
        <div class="section-heading">
          <h2 id="positions-heading">Позиции</h2>
          <button id="add-position" class="add-button" type="button">+ Добавить позицию</button>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th scope="col">Наименование</th>
                <th scope="col">Количество</th>
                <th scope="col">Единица</th>
                <th scope="col">Цена</th>
                <th scope="col">Сумма</th>
                <th scope="col"><span class="visually-hidden">Удалить</span></th>
              </tr>
            </thead>
            <tbody id="positions"></tbody>
          </table>
        </div>
        <div class="adjustments">
          <label class="field">
            <span>Скидка, %</span>
            <input id="discount-percent" type="text" inputmode="decimal" value="0">
          </label>
          <label class="field">
            <span>НДС, %</span>
            <input id="vat-percent" type="text" inputmode="decimal" value="0">
          </label>
          <label class="field">
            <span>Валюта</span>
            <select id="currency">
              <option value="₸">₸</option>
              <option value="₽">₽</option>
              <option value="$">$</option>
              <option value="€">€</option>
            </select>
          </label>
        </div>
      </section>

      <section class="total-card" aria-label="Итог сметы">
        <div class="total-row"><span>Сумма</span><output id="subtotal">0 ₸</output></div>
        <div id="discount-row" class="total-row" hidden><span>Скидка</span><output id="discount-amount">0 ₸</output></div>
        <div id="discounted-row" class="total-row" hidden><span>Сумма со скидкой</span><output id="discounted-total">0 ₸</output></div>
        <div id="vat-row" class="total-row" hidden><span>НДС</span><output id="vat-amount">0 ₸</output></div>
        <div class="total-row grand-total-row"><span>Итого к оплате</span><output id="grand-total" aria-live="polite">0 ₸</output></div>
      </section>

      <section class="card comment-card" aria-labelledby="comment-heading">
        <label class="field" for="comment">
          <span id="comment-heading">Комментарий</span>
          <textarea id="comment" placeholder="Сроки, условия оплаты и другие примечания"></textarea>
          <span id="print-comment" class="print-value"></span>
        </label>
      </section>

      <p class="print-signature" aria-hidden="true">Подпись ____________________</p>
      <div class="actions">
        <button id="new-estimate" class="secondary-button" type="button">Новая смета</button>
        <button id="copy-whatsapp" class="secondary-button" type="button">Скопировать для WhatsApp</button>
        <button id="save-pdf" class="add-button" type="button">Сохранить PDF</button>
      </div>
      <p id="copy-status" class="copy-status" role="status" aria-live="polite"></p>
      <div id="manual-copy" class="manual-copy" hidden>
        <label class="field" for="manual-copy-text"><span>Текст для копирования вручную</span></label>
        <textarea id="manual-copy-text" readonly></textarea>
      </div>
    </main>
  </body>
</html>
